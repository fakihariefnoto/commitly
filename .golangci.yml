run:
  concurrency: 4
  timeout: 5m
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - revive
  disable:
    - scopelint
issues:
  exclude-rules:
    - linters:
        - errcheck
      text: "os.Remove|os.RemoveAll|f\\.Close|tmp\\.Close|\.Close\\(\\)"
